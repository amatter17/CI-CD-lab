name: Day 2 CI
run-name: "Day 2 CI triggered by @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version"
        type: choice
        options:
          - "3.12"
          - "3.13"
        default: "3.13"
      create-package:
        description: "Build the package?"
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

env:
  APP_NAME: temperature

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Announce failure
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "🚨 Tests failed on $BRANCH"

  package:
    needs: test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create-package == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute version
        id: ver
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: echo "packaging version ${{ steps.ver.outputs.version }} (placeholder)"

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify package
        run: echo "verifying (placeholder)"

  pr-comment:
    needs: package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.package.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "✅ CI passed. Package version $VERSION is ready."

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_TOKEN: ${{ secrets.NOTIFY_TOKEN != '' }}
    steps:
      - name: Write job summary
        env:
          TITLE: ${{ vars.REPORT_TITLE }}
          VERSION: ${{ needs.package.outputs.version }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "# $TITLE"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App | $APP_NAME |"
            echo "| Version | ${VERSION:-n/a} |"
            echo "| Commit | ${SHA::7} |"
            echo "| Event | $EVENT |"
            echo "| test | $TEST_RESULT |"
            echo "| package | $PACKAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify
        if: env.HAS_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          echo "Notification sent (token length: ${#TOKEN})"
name: Day 2 CI
run-name: "Day 2 CI triggered by @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version"
        type: choice
        options:
          - "3.12"
          - "3.13"
        default: "3.13"
      create-package:
        description: "Build the package?"
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Announce failure
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "🚨 Tests failed on $BRANCH"

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: echo "packaging (placeholder)"

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify package
        run: echo "verifying (placeholder)"

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print results
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          echo "test:    $TEST_RESULT"
          echo "package: $PACKAGE_RESULT"